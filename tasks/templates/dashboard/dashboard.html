<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} - Task Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-950/70 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-9 w-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-lg text-white shadow-lg shadow-indigo-500/30">
                    TM
                </div>
                <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                    TaskFlow
                </span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="{% url 'home' %}" class="px-4 py-2 text-sm font-medium text-slate-300 hover:text-white transition">Home</a>
                <a href="{% url 'manager_dashboard' %}" class="px-4 py-2 text-sm font-medium rounded-lg transition {% if request.resolver_match.url_name == 'manager_dashboard' %}bg-indigo-600 text-white{% else %}bg-slate-800 hover:bg-slate-700 text-slate-200{% endif %}">Manager Dashboard</a>
                <a href="{% url 'user_dashboard' %}" class="px-4 py-2 text-sm font-medium rounded-lg transition {% if request.resolver_match.url_name == 'user_dashboard' %}bg-indigo-600 text-white{% else %}bg-slate-800 hover:bg-slate-700 text-slate-200{% endif %}">User Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-10">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 pb-6 border-b border-slate-800">
            <div>
                <h1 class="text-3xl font-extrabold text-white">{% block heading %}{% endblock %}</h1>
                <p class="text-slate-400 mt-1 text-sm">{% block subheading %}{% endblock %}</p>
            </div>
            {% block header_actions %}{% endblock %}
        </div>

        {% block content %}{% endblock %}
    </main>
</body>
</html>
